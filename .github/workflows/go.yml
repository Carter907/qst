# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build
        run: go build -v ./...

      - name: Docs
        run: go run ./internal/tools/docgen -out ./docs/cli -format markdown

      - name: Check for stale documentation
        run: git diff --exit-code docs/cli/ || (echo "Documentation is stale. Please run 'go run ./internal/tools/docgen -out ./docs/cli -format markdown' or use pre-commit to generate docs." && exit 1)

      - name: Test
        run: go test -v ./...
