{{ define "content" }}
<h1>Knowledge Graph: {{ .Title }}</h1>
<p>Welcome to the generated static site for this knowledge graph.</p>

<p>{{ .Description }}</p>

{{ if .MermaidGraph }}
<section class="knowledge-graph-section">
  <h2>Knowledge Graph Overview</h2>
  <div class="mermaid-container">
    <pre><code class="language-mermaid">{{ .MermaidGraph }}</code></pre>
  </div>
</section>
{{ end }}
{{ end }}
